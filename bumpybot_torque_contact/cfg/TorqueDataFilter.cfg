#!/usr/bin/env python
PACKAGE = "bumpybot_torque_contact" 

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("wheel0_torque_scalar", double_t, 0, "Wheel 0 torque scalar", 2.0, 0.001, 100000.0)
gen.add("wheel1_torque_scalar", double_t, 0, "Wheel 1 torque scalar", 1.0, 0.001, 100000.0)
gen.add("wheel2_torque_scalar", double_t, 0, "Wheel 2 torque scalar", 1.0, 0.001, 100000.0)

# Enable/Disable the downsampling filter.
gen.add("enable_downsampling", bool_t, 0, "Enable downsampling filter", True)

# Downsampling factor (number of samples averaged before publishing).
gen.add("downsample_factor", int_t, 0, "Downsampling factor", 20, 1, 1000)

# Enable/Disable the low pass filter.
gen.add("enable_low_pass", bool_t, 0, "Enable low pass filter", True)

# Low pass filter window size (number of samples).
gen.add("low_pass_window_size", int_t, 0, "Low pass filter window size", 50, 1, 100)

# Duration for calculating offset window (seconds).
gen.add("zeroing_duration", double_t, 0, "Offset calculation duration (s)", 10.0, 0.1, 60.0)

exit(gen.generate(PACKAGE, "torque_data_filter", "TorqueDataFilter"))
